[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karla-bidi-playback"
version = "1.0.0"
description = "This is a playback python tooling for Karla Bidi to playback audio files on a raspberrypi"
authors = [
    { name = "Jordan Gibbs"},
    { name = "Dana Iopollo"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydub>=0.25.1",
    "pygame>=2.6.1",
    "rust-just>=1.43.1",
    "python-dotenv>=1.0.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
]

[tool.setuptools]
py-modules = ["mp3_player", "eq_processor", "main"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["C", "E", "F", "W"]